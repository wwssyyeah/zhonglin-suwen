name: 钟林速闻每日自动生成

on:
  schedule:
    # 北京时间每天 09:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei fonts-noto-cjk

      - name: Install Python deps
        run: pip install Pillow requests

      - name: Fetch & polish news
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python fetch_60s.py news.json

      - name: Render image
        run: python render.py

      - name: Publish image to repo
        run: |
          cp output.png latest.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.png
          git commit -m "daily: update latest.png" || echo "no changes"
          git push

      - name: Purge jsDelivr CDN cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/${{ github.event.repository.name }}@main/latest.png" || echo "purge skipped"

      - name: Push to WeChat via PushPlus
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
        run: python pushplus_push.py "https://cdn.jsdelivr.net/gh/${{ github.repository_owner }}/${{ github.event.repository.name }}@main/latest.png"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhonglin-suwen-${{ github.run_id }}
          path: output.png
