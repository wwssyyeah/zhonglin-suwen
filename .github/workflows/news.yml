name: 钟林速闻每日自动生成

on:
  schedule:
    # 兜底定时：北京时间 07:50 = UTC 23:50
    # 注意：GitHub 对公开仓库的 schedule 会集中排队、经常延迟数小时，
    # 因此「准点 08:15」请改用外部云端定时器（如 cron-job.org）每天 08:15 触发 workflow_dispatch，
    # dispatch 优先级高、几乎不延迟。见 README / 对话说明。
    - cron: '50 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chinese serif (宋体) font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-arphic-uming fonts-noto-cjk

      - name: Install Python deps
        run: pip install Pillow requests tzdata opencv-python-headless numpy

      - name: Generate clean template
        run: python clean_template_cv2.py

      - name: Fetch & summarize news
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python fetch_news.py news.json

      - name: Render image
        run: python render.py

      - name: Publish image to repo
        env:
          TZ: Asia/Shanghai
        run: |
          cp output.png latest.png
          DATE=$(date +%Y%m%d)
          cp output.png "news-${DATE}.png"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f latest.png "news-${DATE}.png"
          git commit -m "daily: update latest.png" || echo "no changes"
          git push

      - name: Purge jsDelivr CDN cache
        env:
          TZ: Asia/Shanghai
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/${{ github.event.repository.name }}@main/latest.png" || echo "purge skipped"
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository_owner }}/${{ github.event.repository.name }}@main/news-$(date +%Y%m%d).png" || echo "purge skipped"

      - name: Push to WeChat via PushPlus
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          TZ: Asia/Shanghai
        run: |
          DATE=$(date +%Y%m%d)
          python pushplus_push.py "https://cdn.jsdelivr.net/gh/${{ github.repository_owner }}/${{ github.event.repository.name }}@main/news-${DATE}.png"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhonglin-suwen-${{ github.run_id }}
          path: output.png
